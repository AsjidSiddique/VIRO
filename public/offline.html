<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline — Viro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: #0F172A;
      padding: 24px;
      text-align: center;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 28px;
      animation: logoIn 0.5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .icon-wrap img { width: 96px; height: 96px; display: block; }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    .signal-icon {
      font-size: 52px;
      margin-bottom: 16px;
      animation: float 2.5s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #0F172A;
    }
    p {
      font-size: 14px;
      color: #64748B;
      max-width: 280px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #8B5CF6, #F97316);
      box-shadow: 0 4px 20px rgba(139,92,246,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-bottom: 16px;
    }
    .retry-btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 10px rgba(139,92,246,0.2);
    }

    .home-link {
      font-size: 13px;
      color: #8B5CF6;
      font-weight: 600;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1.5px solid #8B5CF640;
      display: inline-block;
    }

    .divider {
      width: 48px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, #8B5CF6, #F97316);
      margin: 0 auto 28px;
    }
  </style>
</head>
<body>
  <div class="icon-wrap">
    <img src="/icon-192.png" alt="Viro" />
  </div>

  <div class="signal-icon">📵</div>
  <h1>You're Offline</h1>
  <div class="divider"></div>
  <p>No internet connection. Check your Wi-Fi or mobile data and try again.</p>

  <button class="retry-btn" onclick="window.location.reload()">
    🔄 Try Again
  </button>
  <br>
  <a href="/" class="home-link">← Go to Home</a>

  <script>
    // Auto-retry when connection comes back
    window.addEventListener('online', () => window.location.reload())
  </script>
</body>
</html>
